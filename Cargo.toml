[package]
name = "desdev"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui-toast = "0.22.0"
egui_extras = { version = "0.36.1", features = ["default", "image"] }
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }
lazy_static = "1.5.0"
libm = "0.2.16"
log = "0.4.33"
lucide-icons = "1.39.0"
pest = "2.8.7"
pest_derive = "2.8.7"
rand = "0.10.2"
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.77"
web-sys = "0.3.104"
getrandom = { version = "0.4.3", features = ["wasm_js"]}

# fast and small wasm
[profile.release]
opt-level = 2 
# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
